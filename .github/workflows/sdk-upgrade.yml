# One-time upgrade to Expo SDK 58 (the version the current Expo Go app needs).
# Runs on GitHub: installs SDK 58 and the matching package versions, commits package.json to main,
# then republishes to Expo Go. The log is saved to the "sdk-upgrade-log" branch.
name: Upgrade to Expo SDK 58
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sdk-upgrade.yml']
  workflow_dispatch:
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      DIR: apps/mobile
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade
        run: |
          cd "$DIR"
          { npm install --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps; } > "$GITHUB_WORKSPACE/upgrade.log" 2>&1 || true
          { npx expo install expo@^58.0.0 --fix || npx expo install expo@^58.0.0 --fix -- --legacy-peer-deps; } >> "$GITHUB_WORKSPACE/upgrade.log" 2>&1
          npx expo install --fix >> "$GITHUB_WORKSPACE/upgrade.log" 2>&1 || npx expo install --fix -- --legacy-peer-deps >> "$GITHUB_WORKSPACE/upgrade.log" 2>&1 || true
          echo "=== expo-doctor" >> "$GITHUB_WORKSPACE/upgrade.log"; npx --yes expo-doctor@latest >> "$GITHUB_WORKSPACE/upgrade.log" 2>&1 || true
          echo "=== export check" >> "$GITHUB_WORKSPACE/upgrade.log"; npx expo export --platform ios --output-dir /tmp/exp >> "$GITHUB_WORKSPACE/upgrade.log" 2>&1 && echo "EXPORT OK" >> "$GITHUB_WORKSPACE/upgrade.log" || echo "EXPORT FAILED" >> "$GITHUB_WORKSPACE/upgrade.log"
          grep -n '"expo"\|"react-native"\|"react"' package.json >> "$GITHUB_WORKSPACE/upgrade.log"
          grep -q '"expo": "[~^]58' package.json
      - name: Commit and republish
        run: |
          git add "$DIR/package.json"
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Upgrade to Expo SDK 58" || { echo "nothing to commit"; exit 0; }
          git pull -q --rebase origin main && git push -q origin HEAD:main
          if [ -f .github/workflows/expo-go.yml ]; then gh workflow run expo-go.yml --ref main || true; fi
      - name: Save log
        if: always()
        run: |
          mkdir -p /tmp/log && cp upgrade.log /tmp/log/ 2>/dev/null || echo none > /tmp/log/upgrade.log
          echo "${{ job.status }} ${GITHUB_SHA::7} $(date -u +%FT%TZ)" > /tmp/log/status.txt
          cd /tmp/log && git init -q -b sdk-upgrade-log && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm log
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sdk-upgrade-log
