# Builds the WebAssembly core + browser diagnostics page and publishes it to
# https://wulfnout.github.io/ps5emu/ — the phone app loads this page.
# Only publishes if the reference programs pass inside WebAssembly.
name: Publish browser app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build core to WebAssembly
        run: sh apps/browser/scripts/build-wasm.sh
      - name: Reference programs must pass in WebAssembly
        run: node apps/browser/scripts/smoke.mjs
      - name: Build page
        working-directory: apps/browser
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
