[workspace]
resolver = "2"
members = [
    "crates/guest-memory",
    "crates/cpu-x64",
    "crates/emulator-core",
    "crates/test-programs",
    "crates/emulator-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
guest-memory = { path = "crates/guest-memory" }
cpu-x64 = { path = "crates/cpu-x64" }
emulator-core = { path = "crates/emulator-core" }
test-programs = { path = "crates/test-programs" }

[profile.release]
opt-level = 3
lto = true
